user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Never log query strings: search terms and SAVI prompts may be sensitive.
    log_format sunovate '$request_id $remote_addr "$request_method $uri" $status $body_bytes_sent '
                        '$request_time "$http_user_agent"';
    access_log /dev/stdout sunovate;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=global:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=default_api:10m rate=180r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=savi:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ingestion:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=per_client:10m;

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        client_max_body_size 3m;
        client_body_timeout 15s;
        client_header_timeout 10s;
        keepalive_timeout 30s;
        send_timeout 30s;
        limit_req_status 429;
        limit_conn per_client 50;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_intercept_errors on;

        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Robots-Tag;

        include /etc/nginx/includes/security-headers.conf;

        error_page 413 = @too_large;
        error_page 429 = @too_many;
        error_page 502 504 = @unavailable;

        location = /nginx-health {
            access_log off;
            return 204;
        }

        location = /api/v1/auth/dev/login {
            limit_req zone=global burst=100 nodelay;
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://api_upstream;
            include /etc/nginx/includes/proxy-common.conf;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        location ^~ /api/v1/ {
            limit_req zone=global burst=100 nodelay;
            limit_req zone=default_api burst=60 nodelay;
            proxy_pass http://api_upstream;
            include /etc/nginx/includes/proxy-common.conf;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/hermes {
            limit_req zone=global burst=100 nodelay;
            limit_req zone=savi burst=20 nodelay;
            proxy_pass http://web_upstream;
            include /etc/nginx/includes/proxy-common.conf;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/knowledge/extract-preview {
            limit_req zone=global burst=100 nodelay;
            limit_req zone=ingestion burst=5 nodelay;
            proxy_pass http://web_upstream;
            include /etc/nginx/includes/proxy-common.conf;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            limit_req zone=global burst=100 nodelay;
            proxy_pass http://web_upstream;
            include /etc/nginx/includes/proxy-common.conf;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        location @too_large {
            default_type application/json;
            return 413 '{"code":"REQUEST_TOO_LARGE","message":"Ukuran permintaan melebihi batas yang diizinkan","details":null,"requestId":"$request_id"}';
        }

        location @too_many {
            default_type application/json;
            include /etc/nginx/includes/security-headers.conf;
            add_header Retry-After 60 always;
            return 429 '{"code":"RATE_LIMITED","message":"Terlalu banyak permintaan. Silakan coba kembali beberapa saat lagi.","details":null,"requestId":"$request_id"}';
        }

        location @unavailable {
            default_type application/json;
            return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Layanan SUNOVATE sedang tidak dapat dihubungi","details":null,"requestId":"$request_id"}';
        }
    }
}
