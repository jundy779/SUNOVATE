# Local development only. PostgreSQL 17 with pgvector. No production services.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sunovate}
      POSTGRES_USER: ${POSTGRES_USER:-sunovate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sunovate_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sunovate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  sunovate-postgres:
